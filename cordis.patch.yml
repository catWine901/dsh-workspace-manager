# RC2 has no public Root Shell seam. Disable only its layout plugin through the
# supported composition layer; uninstalling this package removes this patch and
# restores the untouched native row on the next profile boot.
- id: ui-layout
  disabled: true

- insert:
    # Version-locked host boundary. It verifies RC2 before the Manager can
    # expose its Remote or take over the browser root.
    - id: workspace-manager-dsh-host-adapter
      name: '@tingyu9527/dsh-workspace-manager/adapters/dsh/rc2'
    - id: page-app-manager
      name: '@tingyu9527/dsh-workspace-manager'
      config:
        settlementTimeoutMs: 60000
